# Strategy Parameter Defaults

[combined]
description = "Combined Technical + Sentiment + On-Chain strategy"

[combined.technical]
rsi_period = 14
rsi_overbought = 70.0
rsi_oversold = 30.0
macd_fast = 12
macd_slow = 26
macd_signal = 9
bb_period = 20
bb_std = 2.0
sma_short = 20
sma_long = 50
ema_short = 12
ema_long = 26

[combined.sentiment]
min_articles_for_signal = 3
time_decay_hours = 24
positive_threshold = 0.3
