source_weights = { news = 0.4, twitter = 0.3, reddit = 0.3 }

[combined.onchain]
whale_tx_threshold_usd = 1000000
exchange_netflow_zscore_threshold = 2.0
nupl_bullish = 0.5
nupl_bearish = 0.0
