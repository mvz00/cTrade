[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrade"
version = "0.1.0"
description = "Comprehensive crypto trading application with technical analysis, sentiment analysis, and on-chain metrics"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    # Exchange connectivity
    "ccxt>=4.0.0",
    # Data & analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b1",
    # HTTP & feeds
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "feedparser>=6.0.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Cache & pub/sub
    "redis>=5.0.0",
    # Security
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    # Logging
    "structlog>=24.0.0",
    # WebSocket
    "websockets>=12.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctrade"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ctrade"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "pandas_ta.*",
    "feedparser.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
